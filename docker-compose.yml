# Запуск усієї системи: docker compose up --build
# Застосунок — http://localhost:8080 ; база даних назовні не публікується.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rental
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD у файлі .env (див. .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/rental
      DB_USER: rental
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8080:8080"

volumes:
  pgdata:

spring:
  application:
    name: equiprent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rental}
    username: ${DB_USER:rental}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  # Стиснення відповідей (дефект DEF-12: JS-пакет передавався без стиснення)
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,application/problem+json,image/svg+xml
    min-response-size: 1KB
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  timezone: ${APP_TIMEZONE:Europe/Kyiv}
  max-calendar-days: 62
  max-advance-days: 180
  seed-demo-data: ${SEED_DEMO_DATA:true}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
